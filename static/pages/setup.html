<div class="setup-modal-container">
    <div class="setup-modal none" id="setup-modal-1">
        <div class="dialog-container">
            <h1 data-loc="vino.setup.screen1.h1"></h1>
            <p data-loc="vino.setup.screen1.p1"></p>
            <div class="dialog-buttons">
                <a
                    href="/debug/index.html"
                    class="btn-1 black"
                    data-loc="vino.close-withb"
                ></a>
                <a
                    href="javascript:void(0)"
                    class="btn-2"
                    data-show="#setup-modal-2"
                    data-hide="#setup-modal-1"
                    data-loc="vino.continue"
                ></a>
            </div>
        </div>
    </div>

    <div class="setup-modal none" id="setup-modal-2">
        <div class="dialog-container">
            <h1 data-loc="vino.setup.screen2.h1"></h1>
            <p data-loc="vino.setup.screen2.p1"></p>

            <div class="zipcode-input">
                <input type="number" maxlength="5" class="zip-usa none" />
                <div class="zip-canada none">
                    <label id="ca-region"></label>
                    <select id="ca-region">
                        <option value="default">Region</option>
                        <option value="ON">ON</option>
                    </select>

                    <label id="ca-city"></label>
                    <select id="ca-city">
                        <option value="default">Region</option>
                        <option value="AJ">Ajax</option>
                    </select>
                </div>
            </div>

            <div class="dialog-buttons">
                <a
                    href="javascript:void(0)"
                    class="btn-1"
                    data-show="#setup-modal-1"
                    data-hide="#setup-modal-2"
                    data-loc="vino.back-withb"
                ></a>
                <a
                    href="javascript:void(0)"
                    class="btn-2 disabled zipcode-checkconfirm"
                    data-loc="vino.continue"
                ></a>
            </div>
        </div>
    </div>

    <div class="setup-modal none" id="setup-modal-3">
        <div class="dialog-container">
            <h1 data-loc="vino.setup.screen3.h1"></h1>
            <p data-loc="vino.setup.screen3.p1"></p>

            <div class="tvproviders none">
                <div class="providertypes">
                    <a
                        href="javascript:void(0)"
                        data-provider-filter="cable"
                        data-loc="vino.setup.screen3.t1"
                    ></a>
                    <a
                        href="javascript:void(0)"
                        data-provider-filter="satellite"
                        data-loc="vino.setup.screen3.t2"
                    ></a>
                    <a
                        href="javascript:void(0)"
                        data-provider-filter="broadcast"
                        data-loc="vino.setup.screen3.t3"
                    ></a>
                </div>
            </div>

            <div class="dialog-buttons">
                <a
                    href="javascript:void(0)"
                    class="btn-1"
                    data-show="#setup-modal-2"
                    data-hide="#setup-modal-3"
                    data-loc="vino.back-withb"
                ></a>
                <a
                    href="javascript:void(0)"
                    class="btn-2 provider-checkconfirm"
                    data-loc="vino.continue"
                ></a>
            </div>
        </div>
    </div>

    <div class="setup-modal none" id="setup-modal-4">
        <div class="dialog-container">
            <h1 data-loc="vino.setup.screen4.h1"></h1>
            <p data-loc="vino.setup.screen4.p1"></p>

            <div class="social-buttons">
                <a
                    href="javascript:void(0)"
                    class="login-x"
                    data-show="#x-login"
                    data-hide="#setup-modal-4"
                    data-loc="vino.setup.screen4.b1"
                ></a>
                <a
                    href="javascript:void(0)"
                    class="login-bsky"
                    data-show="#bsky-login"
                    data-hide="#setup-modal-4"
                    data-loc="vino.setup.screen4.b2"
                ></a>
            </div>

            <p class="about-x" data-loc="vino.setup.screen4.p2"></p>

            <div class="dialog-buttons">
                <a
                    href="javascript:void(0)"
                    class="btn-1"
                    data-show="#setup-modal-3"
                    data-hide="#setup-modal-4"
                    data-loc="vino.back-withb"
                ></a>
                <a
                    href="javascript:void(0)"
                    class="btn-2"
                    data-show="#setup-modal-5"
                    data-hide="#setup-modal-4"
                    data-loc="vino.continue"
                ></a>
            </div>
        </div>
    </div>

    <div class="setup-modal none" id="x-login">
        <div class="form">
            <p data-loc="vino.setup.x-login.p1"></p>
            <p class="logged-in none">
                <span data-loc="vino.setup.x-login.p2"></span>
                <span class="username"></span>
            </p>
            <span class="code"></span>
        </div>
        <div class="dialog-buttons">
            <a
                href="javascript:void(0)"
                class="btn-1"
                data-show="#setup-modal-4"
                data-hide="#x-login"
                data-loc="vino.back-withb"
            ></a>
            <a
                href="javascript:void(0)"
                class="btn-2 none"
                data-loc="vino.setup.x-login.b1"
            ></a>
        </div>
    </div>

    <div class="setup-modal none" id="bsky-login">
        <div class="form">
            <p data-loc="vino.setup.bsky-login.p4"></p>
            <input
                type="text"
                class="username"
                data-loc-attr='{"placeholder": "vino.setup.bsky-login.p1"}'
            />
            <input
                type="text"
                class="password"
                data-loc-attr='{"placeholder": "vino.setup.bsky-login.p2"}'
            />
        </div>
        <div class="dialog-buttons">
            <a
                href="javascript:void(0)"
                class="btn-1"
                data-show="#setup-modal-4"
                data-hide="#bsky-login"
                data-loc="vino.back-withb"
            ></a>
            <a
                href="javascript:void(0)"
                class="btn-2 submit-login"
                data-loc="vino.setup.bsky-login.b2"
            ></a>
            <a
                href="javascript:void(0)"
                class="btn-2 submit-logout none"
                data-loc="vino.setup.bsky-login.b1"
            ></a>
        </div>
    </div>
</div>
